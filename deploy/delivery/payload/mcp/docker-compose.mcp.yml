# bodhi2 02 包：bodhi-mcp(8765) / agent_diag(8771) / analytics-admin(8781)
# 选择性启动（推荐用包内 start.sh）：
#   docker compose -f docker-compose.mcp.yml --profile mcp up -d
#   docker compose -f docker-compose.mcp.yml --profile diag up -d
#   docker compose -f docker-compose.mcp.yml --profile admin up -d
#   docker compose -f docker-compose.mcp.yml --profile mcp --profile diag --profile admin up -d
services:
  bodhi-mcp:
    build: .
    image: bodhi2-mcp:1.0
    container_name: bodhi-mcp
    profiles: ["mcp"]
    env_file:
      - config/common.env
      - config/mcp.env
    restart: unless-stopped
    ports:
      - "8765:8765"
    networks:
      - weknora-network
    volumes:
      - ./logs:/app/logs

  bodhi-agent-diag:
    image: bodhi2-mcp:1.0
    container_name: bodhi-agent-diag
    profiles: ["diag"]
    command: ["python3", "tools/domain-mcp/analytics_sql/server.py", "--host", "0.0.0.0", "--port", "8771"]
    env_file:
      - config/common.env
      - config/agent-diag.env
    restart: unless-stopped
    ports:
      - "8771:8771"
    networks:
      - weknora-network

  bodhi-analytics-admin:
    image: bodhi2-mcp:1.0
    container_name: bodhi-analytics-admin
    profiles: ["admin"]
    command: ["python3", "tools/analytics-admin/server.py", "--host", "0.0.0.0", "--port", "8781"]
    env_file:
      - config/common.env
      - config/analytics-admin.env
    restart: unless-stopped
    ports:
      - "8781:8781"
    networks:
      - weknora-network

networks:
  weknora-network:
    external: true
    name: ${WEKNORA_NETWORK:-weknora-network}
