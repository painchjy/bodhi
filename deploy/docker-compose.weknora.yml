# =====================================================================
# bodhi2 · 叠加层：给「上游 WeKnora 自带 neo4j 服务」灌本体投影
# ---------------------------------------------------------------------
# 拓扑 A（推荐，最省事）：Neo4j 由上游 `--profile neo4j` 提供，本文件只**新增**
# 一个一次性服务 bodhi-ontology，不改上游任何服务、不新增网络、不定义 neo4j。
#
# 用法（在【上游 WeKnora 仓库根目录】执行；<BODHI2> 换成本仓库绝对路径）：
#
#   A) WSL (Ubuntu) 里的 Docker Engine —— 2026-09-18 起生效的方式：
#     bash <BODHI2>/tools/ontology-compiler/compile.py  # 编译在 Windows 侧跑也可以
#     export BODHI_DEPLOY_DIR=/mnt/c/Users/PHJY/source/bodhi2/deploy
#     export BODHI_NEO4J_CYPHER_DIR=/mnt/c/Users/PHJY/source/bodhi2/artifacts/neo4j
#     docker compose -f docker-compose.yml \
#       -f <BODHI2>/deploy/docker-compose.weknora.yml \
#       --profile neo4j --profile bodhi up -d --no-build
#
#   B) Windows PowerShell + Docker Desktop（已废弃，仅留参考）：
#     python <BODHI2>\tools\ontology-compiler\compile.py compile
#     $env:BODHI_DEPLOY_DIR       = '<BODHI2>/deploy'
#     $env:BODHI_NEO4J_CYPHER_DIR = '<BODHI2>/artifacts/neo4j'
#     docker compose -f docker-compose.yml `
#       -f <BODHI2>/deploy/docker-compose.weknora.yml `
#       --profile neo4j --profile bodhi up -d --no-build
#
# 注意：
#   - 两个 profile 必须一起启用：neo4j 由上游定义，bodhi 是本服务。
#   - 连接参数（NEO4J_URI / NEO4J_USERNAME / NEO4J_PASSWORD）直接复用上游 .env
#     的值（上游 docs/KnowledgeGraph.md 给的默认值是 bolt://neo4j:7687）。
#   - 这里**不写** depends_on：上游 neo4j 在 profile 下、健康检查未知，
#     等待就绪由 bootstrap-neo4j.sh 的重试完成（默认 60 次 × 2s）。
#   - BODHI_* 两个变量没有默认值是故意的：叠加模式下相对路径会以上游仓库
#     目录为基准解析，必须显式给绝对路径。写法按运行环境选（都用正斜杠）：
#       WSL 里的 Docker Engine      -> /mnt/c/Users/PHJY/source/bodhi2/...
#       Windows + Docker Desktop    -> C:/Users/PHJY/source/bodhi2/...
#     （2026-09-18 起本机跑的是前者，见 deploy/README.md §10 实测记录）
# =====================================================================
services:
  # ---------------------------------------------------------------------
  # app：挂载「本体知识提取」的 preset 与系统提示词模板（零重建 A1）
  # ---------------------------------------------------------------------
  # 上游 app 启动时从容器内 /app/config/ **读文件**加载 agent-type preset 与 prompt
  # 模板（非 go:embed，见 docs/weknora-fork.md §10.11）。因此只要把改好的两个文件
  # 挂进去、重建 app 容器即可生效，**不需要改 Go、不需要重建镜像**。
  #
  # 文件由 deploy/weknora-fork/gen_agent_config.py 从本体产物生成：
  #   config/agent_type_presets.yaml                        预设 ontology-extract-bmm / -ea
  #   config/agent_system_prompt.yaml                       模板 ontology_extract_agent_bmm / -ea
  app:
    volumes:
      - ${BODHI_DEPLOY_DIR:?请先设置 BODHI_DEPLOY_DIR=<本仓库>/deploy}/weknora-fork/config/agent_type_presets.yaml:/app/config/agent_type_presets.yaml:ro
      - ${BODHI_DEPLOY_DIR:?请先设置 BODHI_DEPLOY_DIR=<本仓库>/deploy}/weknora-fork/config/agent_system_prompt.yaml:/app/config/prompt_templates/agent_system_prompt.yaml:ro
    # 让容器能访问宿主上的 MCP 服务（本体知识保存工具，见 tools/ontology-mcp/server.py）：
    # mcp_services.url = http://host.docker.internal:8765/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------
  # bodhi-ontology：本体投影灌库 —— **已停用**（2026-09-19 用户决定放弃 Neo4j 本体投影）
  # ---------------------------------------------------------------------
  # 本体模型的落点改为「企业本体模型」知识库：每个本体类一页、关系在页面中表达，
  # 由 `deploy/weknora-fork/refresh_ontology_kb.sh` 从 TTL 编译生成（见 docs/weknora-fork.md §10.13）。
  # 需要临时恢复图投影时，取消下面整段注释即可（bootstrap 脚本与 cypher 仍在 deploy/ 与 artifacts/neo4j/）。
  #
  # bodhi-ontology:
  #   image: ${NEO4J_IMAGE:-neo4j:5-community}
  #   container_name: bodhi2-ontology-bootstrap
  #   restart: "no"
  #   profiles:
  #     - bodhi
  #   entrypoint: ["/bin/sh", "/bodhi-deploy/bootstrap-neo4j.sh"]
  #   environment:
  #     - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
  #     - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:?上游 .env 里必须已设置 NEO4J_PASSWORD}
  #     - BODHI_CYPHER_DIR=/bootstrap
  #   volumes:
  #     - ${BODHI_DEPLOY_DIR:?请先设置 BODHI_DEPLOY_DIR=<本仓库>/deploy}/bootstrap-neo4j.sh:/bodhi-deploy/bootstrap-neo4j.sh:ro
  #     - ${BODHI_NEO4J_CYPHER_DIR:?请先设置 BODHI_NEO4J_CYPHER_DIR=<本仓库>/artifacts/neo4j}:/bootstrap:ro
  #   networks:
  #     - WeKnora-network
