# 智能体配置真源（发布期唯一入口）
#
# 为什么有这个文件（2026-10-26 用户裁定）：
#   - **不做 `/admin` 后台**：工具面/提示词由**发布程序**写入，写完由 `selfcheck` 校验；
#   - UI 上能改的项（名字、库绑定、mcp 服务勾选）**以 UI 为准**；改完跑 `apply_config.py --check`
#     看是否漂移；**工具面与提示词以本文件为准**（UI 改这两个会被下次发布覆盖）。
#
# 用法：
#   python3 tools/delivery/apply_config.py --check        # 只比对（不写），退出码 1=有漂移
#   python3 tools/delivery/apply_config.py --apply        # 幂等写入（有变化才 UPDATE）
#   python3 tools/delivery/apply_config.py --apply --only 09e54ee1…   # 只处理某智能体
#
# 口径：
#   - `allowed_tools`：**只列工具名**（WeKnora 原生工具名 + `mcp_<server>_<tool>`）；
#   - `prompt_file`：相对本目录的 `config/`（`system_prompt` 从 md 的 ```text 代码块取）；
#   - `mcp_services`：留空表示"不动 UI 上的勾选"；给了就按 id 覆盖（发布包里 id 由 `mcp_services` 表定）。
version: 2
agents:
  - id: 09e54ee1-6d0b-452f-8160-a26990bc71e6
    name: 技术方案评审智能体
    prompt_file: agent_review_prompt.md
    # 2026-10-27（用户实证 + 库表核对，见 CONFIG-MATRIX.md §1）：
    #   `allowed_tools` **只作用于 WeKnora 内置工具**；往里写 `mcp_*` 是**无效配置** ✗
    #   （MCP 工具由 `config.mcp_services` 挂载决定，且工具清单不落库、会话时实时 tools/list）。
    #   因此这里只保留真·内置工具；**内网 UI 自建智能体留空（= 平台默认集）等价，不必改**。
    builtin_tools:
      - data_schema
      - data_analysis
    mcp_services:
      - a7c1f0d2-1b2e-4f3a-9c4d-b0d100000001
      - a7c1f0d2-1b2e-4f3a-9c4d-b0d100000002

  # ── 2026-10-30：L1 建模智能体 + 测试评审智能体 ───────────────────────────────
  #  `id` 留空 ⇒ 按 `name` 查找；库里没有就 `--create` 新建（内网不必先在 UI 建）
  #  `mcp_service_names` 按**服务名**解析成 id（id 每套环境不同，写死会错库 ✓）
  - id: ""
    name: 企业知识管理建模智能体
    prompt_file: agent_modeling_prompt.md
    builtin_tools:
      - data_schema
      - data_analysis
    mcp_service_names:
      - bodhi_ontology
      - it_platform
    # 2026-10-30 用户口径：建模智能体的**工作库 = 所有领域库（含企业知识管理领域自己）**
    all_domain_kbs: true

  - id: ""
    name: 技术方案评审智能体（测试）
    prompt_file: agent_review_test_prompt.md
    builtin_tools:
      - data_schema
      - data_analysis
    mcp_service_names:
      - bodhi_ontology
      - it_platform
    # P3：测试领域库 + 测试工作库（先建库，再把名字写这里）
    knowledge_base_names:
      - 技术方案评审领域模型（测试）
      - 技术方案评审任务知识库（测试）
