# =====================================================================
# bodhi2 前端 nginx 追加配置：把 /bodhi/ 反代到宿主上的 bodhi-mcp 服务
# ---------------------------------------------------------------------
# 挂载方式（不动镜像）：
#   deploy/docker-compose.weknora.yml 的 frontend 服务加
#     - .../bodhi-proxy.conf:/etc/nginx/conf.d/zz-bodhi-proxy.conf:ro
#   并给 frontend 加 extra_hosts: host.docker.internal:host-gateway
#
# 路径约定（与 tools/ontology-mcp/server.py 对齐）：
#   /bodhi/view     Bodhi 语义图谱页面（HTML）
#   /bodhi/graph    语义图数据（JSON：节点带类标签/颜色，边带关系 type+label+方向）
#   /bodhi/page     单页全文（JSON）
#   /bodhi/pending  待确认合并列表（JSON）
#   /bodhi/resolve  裁决（merge | create）
# =====================================================================
location /bodhi/ {
    proxy_pass http://host.docker.internal:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 抽取是长任务（LLM 1~3 分钟），别让 nginx 先超时
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
}
